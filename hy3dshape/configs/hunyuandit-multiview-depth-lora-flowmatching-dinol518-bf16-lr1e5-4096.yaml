name: "HunyuanDiT flowmatching with MultiView + Depth LoRA; VAE: 4096 token length; ImageEncoder: DINO-v2 Large; ImageSize: 518"
# Multi-view + Depth LoRA fine-tuning configuration
# Combines multi-view rendering with depth conditioning via ControlNet

training:
  steps: 10_0000_0000
  use_amp: true
  amp_type: "bf16"
  base_lr: 1e-5
  gradient_clip_val: 1.0
  gradient_clip_algorithm: "norm"
  every_n_train_steps: 2000
  val_check_interval: 200
  limit_val_batches: 16

dataset:
  target: hy3dshape.data.dit_asl.AlignedShapeLatentModule
  params:
    #! Base setting
    batch_size: 2  # 降低batch size因为多视图内存需求更大
    num_workers: 8
    val_num_workers: 4

    # Data paths
    train_data_list: tools/mini_mv_depth_trainset/preprocessed
    val_data_list: tools/mini_mv_depth_trainset/preprocessed

    #! Image loading - Multi-view settings
    cond_stage_key: "image"
    image_size: 518
    mean: &mean [0.5, 0.5, 0.5]
    std: &std [0.5, 0.5, 0.5]
    
    #! Multi-view settings
    load_multiview: true  # 启用多视图加载
    num_views: 4  # 前后左右4个视图
    view_selection: ["front", "back", "left", "right"]  # 指定视图
    
    #! Depth loading
    load_depth: true  # 启用深度图加载
    depth_per_view: true  # 每个视图都有对应深度图

    #! Point cloud sampling
    pc_size: &pc_size 81920
    pc_sharpedge_size: &pc_sharpedge_size 0
    sharpedge_label: &sharpedge_label true
    return_normal: true

    #! Augmentation
    padding: true

model:
  target: hy3dshape.models.diffusion.flow_matching_sit.Diffuser
  params:
    first_stage_key: "surface"
    cond_stage_key: "image"
    scale_by_std: false
    z_scale_factor: &z_scale_factor 1.0039506158752403
    torch_compile: false

    # LoRA Configuration
    lora_config:
      rank: 8  # 可以考虑增加到16因为多视图复杂度更高
      target_modules: ["to_q", "to_k", "to_v", "to_out.0"]
      
    # Multi-view ControlNet Configuration
    control_net_config:
      pretrained_model_name_or_path: "lllyasviel/sd-controlnet-depth"
      train_unet: false
      multi_view_fusion: true  # 启用多视图特征融合
      
    # Model parameters
    control_in_channels: 4  # 4个视图的深度图输入 (4 x 1 channels)
    
    # Multi-view specific settings
    multiview_config:
      num_views: 4
      view_fusion_method: "attention"  # 或 "concat", "average"
      cross_view_attention: true

    first_stage_config:
      target: hy3dshape.models.autoencoders.ShapeVAE
      from_pretrained: tencent/Hunyuan3D-2.1

    cond_stage_config:
      target: hy3dshape.models.conditioner.MultiViewImageEncoder  # 使用多视图编码器
      params:
        drop_ratio: 0.1
        num_views: 4
        main_image_encoder:
            type: DinoImageEncoder 
            kwargs:
                version: 'facebook/dinov2-large'
                image_size: 518
                use_cls_token: true
        view_fusion_method: "attention"

    denoiser_cfg:
      target: hy3dshape.models.denoisers.hunyuandit.HunYuanDiTPlain
      from_pretrained: tencent/Hunyuan3D-2.1
      params:
        with_decoupled_ca: true
        additional_cond_hidden_state: 768  # 深度特征维度
        multiview_cond_hidden_state: 3072  # 4视图 x 768维特征
        
    scheduler_cfg:
      transport:
        target: hy3dshape.models.diffusion.transport.create_transport
        params:
          path_type: Linear
          prediction: velocity
      sampler:
        target: hy3dshape.models.diffusion.transport.Sampler
        params: {}
        ode_params:
          sampling_method: euler
          num_steps: &num_steps 50

    optimizer_cfg:
      optimizer:
        target: torch.optim.AdamW
        params:
          betas: [0.9, 0.99]
          eps: 1.e-6
          weight_decay: 1.e-2

      scheduler:
        target: hy3dshape.utils.trainings.lr_scheduler.LambdaWarmUpCosineFactorScheduler
        params:
          warm_up_steps: 100  # 增加warmup步数
          f_start: 1.e-6
          f_min: 1.e-3
          f_max: 1.0

    pipeline_cfg:
      target: hy3dshape.pipelines.Hunyuan3DDiTFlowMatchingPipeline

    image_processor_cfg:
      target: hy3dshape.preprocessors.MVImageProcessorV2  # 使用多视图预处理器
      params:
        size: 518

callbacks:
    logger:
      target: hy3dshape.utils.trainings.mesh_log_callback.ImageConditionalASLDiffuserLogger
      params:
        step_frequency: 1000
        num_samples: 1
        sample_times: 1
        mean: *mean
        std: *std
        bounds: [-1.01, -1.01, -1.01, 1.01, 1.01, 1.01]
        octree_depth: 8
        num_chunks: 50000
        mc_level: 0.0
        
    # Multi-view Depth LoRA Saving Callback
    peft_save:
      target: hy3dshape.utils.trainings.peft.PeftSaveCallback
      params:
        save_dir: "output_folder/dit/multiview_depth_lora_checkpoints"
        save_every_n_steps: 1000
    
    file_loggers:
        target: hy3dshape.utils.trainings.mesh_log_callback.ImageConditionalFixASLDiffuserLogger
        params:
          step_frequency: 500
          test_data_path: "tools/mini_testset/images.json"
