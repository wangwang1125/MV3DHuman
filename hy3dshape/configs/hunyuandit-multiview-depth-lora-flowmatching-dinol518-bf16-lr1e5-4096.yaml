name: "HunyuanDiT Multi-View Depth LoRA; VAE: 4096 token length; ImageEncoder: DINO-v2 Large; ImageSize: 518; Views: 4 (front/back/left/right)"
# Multi-View LoRA fine-tuning with depth condition via MultiViewControlNet
# Enhanced to use 4 viewpoints (front, right, back, left) with attention fusion

training:
  steps: 10_0000_0000
  use_amp: true
  amp_type: "bf16"
  base_lr: 1e-5
  gradient_clip_val: 1.0
  gradient_clip_algorithm: "norm"
  every_n_train_steps: 2000
  val_check_interval: 1500
  limit_val_batches: 16

dataset:
  target: hy3dshape.data.dit_asl_multiview.AlignedShapeLatentMultiViewModule
  params:
    #! Base setting
    batch_size: 2  # 降低batch size因为每个样本包含4个视图
    num_workers: 8
    val_num_workers: 4

    # Data paths
    train_data_list: tools/mini_mv_trainset/preprocessed
    val_data_list: tools/mini_mv_testset/preprocessed

    #! Multi-view configuration
    multiview_indices: [0, 1, 2, 3]  # 前(0°), 右(90°), 后(180°), 左(270°)四个视图
    depth_fusion_strategy: "multiview"  # "multiview" (keep all views for ControlNet), "average", "max", "weighted"

    #! Image loading
    cond_stage_key: "image"
    image_size: 518
    mean: &mean [0.5, 0.5, 0.5]
    std: &std [0.5, 0.5, 0.5]
    
    #! Depth loading
    load_depth: true

    #! Point cloud sampling
    pc_size: &pc_size 81920
    pc_sharpedge_size: &pc_sharpedge_size 0
    sharpedge_label: &sharpedge_label true
    return_normal: true

    #! Augmentation
    padding: true

model:
  target: hy3dshape.models.diffusion.flow_matching_sit.Diffuser
  params:
    first_stage_key: "surface"
    cond_stage_key: "image"
    scale_by_std: false
    z_scale_factor: &z_scale_factor 1.0039506158752403
    torch_compile: false

    # LoRA Configuration
    lora_config:
      rank: 8
      target_modules: ["to_q", "to_k", "to_v", "to_out.0"]
      
    # MultiView ControlNet Configuration
    control_net_config:
      pretrained_model_name_or_path: "lllyasviel/sd-controlnet-depth"  # Not used for multi-view, kept for compatibility
      train_unet: false  # Only train LoRA, not full UNet
      fusion_strategy: "attention"  # Multi-view fusion strategy: "attention", "concat", "average", "weighted"
      
    # Model parameters for multi-view support
    control_in_channels: 1  # Input channels per depth map

    first_stage_config:
      target: hy3dshape.models.autoencoders.ShapeVAE
      from_pretrained: tencent/Hunyuan3D-2.1

    cond_stage_config:
      target: hy3dshape.models.conditioner.SingleImageEncoder
      params:
        drop_ratio: 0.1
        main_image_encoder:
            type: DinoImageEncoderMV 
            kwargs:
                version: 'facebook/dinov2-large'
                image_size: 518
                use_cls_token: true
                view_num: 4  # Number of input views for DINO encoder

    denoiser_cfg:
      target: hy3dshape.models.denoisers.hunyuandit.HunYuanDiTPlain
      from_pretrained: tencent/Hunyuan3D-2.1
      params:
        with_decoupled_ca: true  # 启用additional条件处理
        additional_cond_hidden_state: 768  # 深度特征维度，与MultiViewControlNet输出匹配
        decoupled_ca_dim: 16  # DCA使用的token数量（现在与深度特征匹配）
        decoupled_ca_weight: 2.0  # 增加深度条件权重（从1.0提高到2.0）
        num_views: 4  # Number of views for the denoiser
        
    scheduler_cfg:
      transport:
        target: hy3dshape.models.diffusion.transport.create_transport
        params:
          path_type: Linear
          prediction: velocity
      sampler:
        target: hy3dshape.models.diffusion.transport.Sampler
        params: {}
        ode_params:
          sampling_method: euler
          num_steps: &num_steps 50

    optimizer_cfg:
      optimizer:
        target: torch.optim.AdamW
        params:
          betas: [0.9, 0.99]
          eps: 1.e-6
          weight_decay: 1.e-2

      scheduler:
        target: hy3dshape.utils.trainings.lr_scheduler.LambdaWarmUpCosineFactorScheduler
        params:
          warm_up_steps: 50
          f_start: 1.e-6
          f_min: 1.e-3
          f_max: 1.0

    pipeline_cfg:
      target: hy3dshape.pipelines.Hunyuan3DDiTFlowMatchingPipeline

    image_processor_cfg:
      target: hy3dshape.preprocessors.MVImageProcessorV2
      params: {}

callbacks:
    logger:
      target: hy3dshape.utils.trainings.mesh_log_callback.ImageConditionalASLDiffuserLogger
      params:
        step_frequency: 1000
        num_samples: 1
        sample_times: 1
        mean: *mean
        std: *std
        bounds: [-1.01, -1.01, -1.01, 1.01, 1.01, 1.01]
        octree_depth: 8
        num_chunks: 50000
        mc_level: 0.0
        
    # LoRA Saving Callback
    peft_save:
      target: hy3dshape.utils.trainings.peft.PeftSaveCallback
      params:
        save_dir: "output_folder/dit/multiview_depth_lora_checkpoints"
        save_every_n_steps: 1000
    
    file_loggers:
        target: hy3dshape.utils.trainings.mesh_log_callback.ImageConditionalFixASLDiffuserLogger
        params:
          step_frequency: 500
          test_data_path: "tools/mini_testset/images.json"
