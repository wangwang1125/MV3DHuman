name: "HunyuanDiT Multi-View RGB Full Fine-tuning (from Hunyuan3D-2mv); VAE: 4096 token length; ImageEncoder: DINO-v2 Large; ImageSize: 518; Views: 4 (front/right/back/left)"
# Multi-View full fine-tuning with RGB image condition via DinoImageEncoderMV
# RGB images from 4 views are processed to generate tokens for cross-attention
# All DiT model weights are trainable (not LoRA)
# Uses Hunyuan3D-2mv as pretrained model with Hunyuan3DDiT architecture (no key name conversion needed)
# Supports loading from pretrained weights and resuming from checkpoints

training:
  steps: 10_0000_0000
  use_amp: true
  amp_type: "bf16"
  base_lr: 1e-5
  gradient_clip_val: 1.0
  gradient_clip_algorithm: "norm"
  every_n_train_steps: 2000
  val_check_interval: 1500
  limit_val_batches: 16
  monitor: "val/total_loss"
  output_dir: "output_folder/dit/multiview_rgb_finetuning_mv"
  ckpt_path: ""  # Set to checkpoint path to resume training, e.g., "output_folder/dit/multiview_rgb_finetuning_mv/ckpt/ckpt-00020000.ckpt"

dataset:
  target: hy3dshape.data.dit_asl_multiview.AlignedShapeLatentMultiViewModule
  params:
    #! Base setting
    batch_size: 2  # 降低batch size因为每个样本包含4个视图
    num_workers: 8
    val_num_workers: 4

    # Data paths
    train_data_list: tools/mini_mv_trainset/preprocessed
    val_data_list: tools/mini_mv_testset/preprocessed

    #! Multi-view configuration
    multiview_indices: [0, 1, 2, 3]  # 前(0°), 右(90°), 后(180°), 左(270°)四个视图
    # normal_fusion_strategy not needed for RGB-only training

    #! Image loading
    cond_stage_key: "image"
    image_size: 518
    mean: &mean [0.5, 0.5, 0.5]
    std: &std [0.5, 0.5, 0.5]
    
    #! Normal loading - DISABLED for RGB-only training
    load_normal: false

    #! Point cloud sampling
    pc_size: &pc_size 81920
    pc_sharpedge_size: &pc_sharpedge_size 0
    sharpedge_label: &sharpedge_label true
    return_normal: true

    #! Augmentation
    padding: true

model:
  target: hy3dshape.models.diffusion.flow_matching_sit.Diffuser
  params:
    first_stage_key: "surface"
    cond_stage_key: "image"
    scale_by_std: false
    z_scale_factor: &z_scale_factor 1.0039506158752403
    torch_compile: false

    # LoRA Configuration - DISABLED for full fine-tuning
    # All DiT model weights will be trainable
    # lora_config:
    #   rank: 8
    #   target_modules: ["to_q", "to_k", "to_v", "to_out.0"]

    first_stage_config:
      target: hy3dshape.models.autoencoders.ShapeVAE
      from_pretrained: tencent/Hunyuan3D-2  # VAE使用Hunyuan3D-2（mv模型使用相同的VAE）
      subfolder: hunyuan3d-vae-v2-0  # VAE的subfolder（与Hunyuan3D-2mv一致）
      use_safetensors: false  # VAE使用ckpt格式
      params:
        point_feats: 4  # 匹配训练数据维度：return_normal=True(3维normal) + sharpedge_label=True(1维label) = 4维
        pc_size: 81920  # 必须与训练数据的 pc_size 一致
        pc_sharpedge_size: 0  # 必须与训练数据的 pc_sharpedge_size 一致

    cond_stage_config:
      target: hy3dshape.models.conditioner.SingleImageEncoder
      params:
        drop_ratio: 0.1
        # Use DinoImageEncoderMV to process RGB images from 4 views
        main_image_encoder:
            type: DinoImageEncoderMV 
            kwargs:
                version: 'facebook/dinov2-giant'  # 使用 dinov2-giant (1536维) 以匹配预训练模型
                image_size: 518
                use_cls_token: true
                view_num: 4  # Number of input views for DINO encoder

    denoiser_cfg:
      target: hy3dshape.models.denoisers.hunyuan3ddit.Hunyuan3DDiT
      from_pretrained: tencent/Hunyuan3D-2mv  # Load pretrained weights from Hunyuan3D-2mv
      subfolder: hunyuan3d-dit-v2-mv  # 使用Hunyuan3D-2mv作为预训练模型
      use_safetensors: true  # Hunyuan3D-2mv使用safetensors格式
      params:
        in_channels: 64  # VAE latent channels (must match VAE output)
        context_in_dim: 1536  # 使用 1536 维以匹配 dinov2-giant 的输出维度
        hidden_size: 1024  # Hidden dimension
        num_heads: 16  # Number of attention heads
        depth: 16  # Depth of double_blocks
        depth_single_blocks: 32  # Depth of single_blocks
        axes_dim: [64]  # Positional encoding dimension (must satisfy hidden_size // num_heads = 64)
        mlp_ratio: 4.0  # MLP ratio
        qkv_bias: true  # Use bias in QKV projections
        
    scheduler_cfg:
      transport:
        target: hy3dshape.models.diffusion.transport.create_transport
        params:
          path_type: Linear
          prediction: velocity
      sampler:
        target: hy3dshape.models.diffusion.transport.Sampler
        params: {}
        ode_params:
          sampling_method: euler
          num_steps: &num_steps 50

    optimizer_cfg:
      optimizer:
        target: torch.optim.AdamW
        params:
          betas: [0.9, 0.99]
          eps: 1.e-6
          weight_decay: 1.e-2

      scheduler:
        target: hy3dshape.utils.trainings.lr_scheduler.LambdaWarmUpCosineFactorScheduler
        params:
          warm_up_steps: 50
          f_start: 1.e-6
          f_min: 1.e-3
          f_max: 1.0

    pipeline_cfg:
      target: hy3dshape.pipelines.Hunyuan3DDiTFlowMatchingPipeline

    image_processor_cfg:
      target: hy3dshape.preprocessors.MVImageProcessorV2
      params: {}

callbacks:
    logger:
      target: hy3dshape.utils.trainings.mesh_log_callback.ImageConditionalASLDiffuserLogger
      params:
        step_frequency: 1000
        num_samples: 1
        sample_times: 1
        mean: *mean
        std: *std
        bounds: [-1.01, -1.01, -1.01, 1.01, 1.01, 1.01]
        octree_depth: 8
        num_chunks: 50000
        mc_level: 0.0
        
    # Checkpoints are saved automatically by ModelCheckpoint callback in main.py
    # No need for LoRA-specific saving callback
    
    file_loggers:
        target: hy3dshape.utils.trainings.mesh_log_callback.ImageConditionalFixASLDiffuserLogger
        params:
          step_frequency: 500
          test_data_path: "tools/mini_testset/images.json"
