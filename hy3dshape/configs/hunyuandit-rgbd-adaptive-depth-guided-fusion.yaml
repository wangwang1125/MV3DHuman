name: "HunyuanDiT RGBD自适应深度引导融合; VAE: 4096 token length; ImageEncoder: DINO-v2 Large + 自适应深度引导融合; ImageSize: 518"
# RGBD自适应深度引导融合训练配置 - 根据深度质量动态调整引导强度

training:
  steps: 100000
  use_amp: true
  amp_type: "bf16"
  base_lr: 1e-4
  gradient_clip_val: 1.0
  gradient_clip_algorithm: "norm"
  every_n_train_steps: 2000
  val_check_interval: 2000
  limit_val_batches: 16

dataset:
  target: hy3dshape.data.rgbd_dit_asl.RGBDAlignedShapeLatentModule
  params:
    #! Base setting
    batch_size: 2
    num_workers: 8
    val_num_workers: 2

    # Data 
    train_data_list: tools/mini_depth_trainset/preprocessed
    val_data_list: tools/mini_depth_trainset/preprocessed

    #! Image loading
    cond_stage_key: "image"
    depth_stage_key: "depth"
    image_size: 518
    mean: &mean [0.5, 0.5, 0.5]
    std: &std [0.5, 0.5, 0.5]
    
    # 深度图预处理参数
    depth_mean: &depth_mean [0.5]
    depth_std: &depth_std [0.5]
    depth_normalize: true
    depth_clip_range: [0.0, 10.0]
    require_depth: true

    #! Point cloud sampling
    pc_size: &pc_size 81920
    pc_sharpedge_size: &pc_sharpedge_size 0
    sharpedge_label: &sharpedge_label true
    return_normal: true

    #! Augmentation
    padding: true
    depth_augmentation:
      noise_std: 0.02  # 稍微增加噪声，测试自适应能力
      dropout_prob: 0.1

model:
  target: hy3dshape.models.diffusion.flow_matching_sit.Diffuser
  params:
    first_stage_key: "surface"
    cond_stage_key: "image"
    depth_stage_key: "depth"
    scale_by_std: false
    z_scale_factor: 1.0039506158752403
    torch_compile: false
    #! VAE
    first_stage_config:
      target: hy3dshape.models.autoencoders.ShapeVAE
      from_pretrained: tencent/Hunyuan3D-2.1

    cond_stage_config:
      target: hy3dshape.models.conditioner.RGBDImageEncoder
      params:
        drop_ratio: 0.1
        freeze_rgb_encoder: true
        main_image_encoder:
            type: DinoImageEncoder 
            kwargs:
                version: 'facebook/dinov2-large'
                image_size: 518
                use_cls_token: true
        
        # 深度编码器配置
        depth_encoder_config:
          type: 'lightweight'
          input_channels: 1
          hidden_dim: 768
          num_layers: 4
        
        # 自适应深度引导融合配置
        fusion_config:
          type: 'adaptive_depth_guided'  # 使用自适应版本
          rgb_dim: 1024
          depth_dim: 768
          output_dim: 1024
          guidance_rank: 64
          base_alpha: 0.15      # 基础引导强度稍高
          adaptive_alpha: true  # 启用自适应alpha
          dropout: 0.1

    denoiser_cfg:
      target: hy3dshape.models.denoisers.hunyuandit.HunYuanDiTPlain
      from_pretrained: tencent/Hunyuan3D-2.1
      freeze_pretrained: true
        
    scheduler_cfg:
      transport:
        target: hy3dshape.models.diffusion.transport.create_transport
        params:
          path_type: Linear
          prediction: velocity
      sampler:
        target: hy3dshape.models.diffusion.transport.Sampler
        params: {}
        ode_params:
          sampling_method: euler
          num_steps: &num_steps 50

    optimizer_cfg:
      optimizer:
        target: torch.optim.AdamW
        params:
          betas: [0.9, 0.99]
          eps: 1.e-6
          weight_decay: 1.e-3

      scheduler:
        target: hy3dshape.utils.trainings.lr_scheduler.LambdaWarmUpCosineFactorScheduler
        params:
          warm_up_steps: 100
          f_start: 1.e-6
          f_min: 1.e-5
          f_max: 1.0

    pipeline_cfg:
      target: hy3dshape.pipelines.Hunyuan3DDiTFlowMatchingPipeline

    image_processor_cfg:
      target: hy3dshape.preprocessors.ImageProcessorV2
      params: {}

callbacks:
  logger:
    target: hy3dshape.utils.trainings.mesh_log_callback.ImageConditionalASLDiffuserLogger
    params:
      step_frequency: 500
      num_samples: 1
      sample_times: 1
      mean: &mean [0.5, 0.5, 0.5]
      std: &std [0.5, 0.5, 0.5]
      bounds: [-1.01, -1.01, -1.01, 1.01, 1.01, 1.01]
      octree_depth: 8
      num_chunks: 50000
      mc_level: 0.0
      log_depth: true
      depth_mean: &depth_mean [0.5]
      depth_std: &depth_std [0.5]
  
  file_loggers:
    target: hy3dshape.utils.trainings.mesh_log_callback.ImageConditionalFixASLDiffuserLogger
    params:
      step_frequency: 250
      test_data_path: "tools/mini_testset/images.json"'
        # 记录自适应alpha值
        log_alpha_values: true

# 微调特定配置
finetuning:
  # 参数冻结策略
  freeze_patterns:
    - "first_stage_model.*"
    - "cond_stage_model.main_image_encoder.*"
    - "model.*.attn.*"
    - "model.*.mlp.*"
  
  # 可训练参数模式
  trainable_patterns:
    - "cond_stage_model.depth_encoder.*"
    - "cond_stage_model.fusion.*"
    - "model.*.adaln.*"
  
  # 学习率策略
  lr_multipliers:
    "cond_stage_model.depth_encoder": 1.0
    "cond_stage_model.fusion.depth_guidance": 1.0
    "cond_stage_model.fusion.alpha_predictor": 0.5  # alpha预测器使用较小学习率
    "model.*.adaln": 0.1
  
  # 正则化
  regularization:
    guidance_delta_l2: 0.001
    alpha_smoothness: 0.01  # 对alpha值添加平滑性约束
    depth_feature_dropout: 0.1

# 实验配置
experiment:
  # 对比实验设置
  baseline_configs:
    - "hunyuandit-rgbd-finetuning-flowmatching-dinol518-bf16-lr1e4-4096.yaml"  # 交叉注意力基线
    - "hunyuandit-rgbd-depth-guided-fusion.yaml"  # 固定alpha版本
  
  # 评估指标
  evaluation_metrics:
    - "chamfer_distance"
    - "f_score"
    - "training_stability"
    - "parameter_efficiency"
    - "alpha_distribution"  # 记录alpha值分布
  
  # 超参数搜索
  hyperparameter_search:
    guidance_rank: [32, 64, 128]
    base_alpha: [0.05, 0.1, 0.15, 0.2]
    num_guidance_layers: [1, 2, 3]