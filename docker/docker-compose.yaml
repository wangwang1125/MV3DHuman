version: "3.9"

# 使用说明：
# 1. 如果使用 tar 压缩包的镜像：
#    - 先加载镜像：docker load -i hunyuan3d21.tar
#    - 查看加载后的镜像名称和标签：docker images | grep hunyuan3d21
#    - 如果镜像名称或标签不同，请修改下面的 image 字段
# 2. 如果从 Docker Hub 或其他 registry 拉取：
#    - 直接使用 docker-compose up 即可
#
services:
  hunyuan3d:
    # 如果从 tar 文件加载，请确保这里的镜像名称和标签与加载后的镜像一致
    # 例如：hunyuan3d21:latest 或 hunyuan3d21:cu124 等
    image: hunyuan3d21:latest
    container_name: hunyuan3d21
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics
      - PYOPENGL_PLATFORM=egl

    ports:
      - "6009:6009"

    volumes:
      # 模型权重
      - ./weights:/workspace/weights

      # HuggingFace 模型缓存（从 Hub 下载的模型会存储在这里）
      # 目录结构示例：
      # hf_cache/
      #   └── hub/
      #       └── models--tencent--Hunyuan3D-2.1/
      - ./hf_cache:/root/.cache/huggingface

      # LoRA 权重目录（包含所有训练好的 LoRA checkpoints）
      # 目录结构示例：
      # lora_checkpoints/
      #   ├── multiview_rgb_lora_checkpoints/
      #   │   └── step_xxx/ 或 *.ckpt
      #   ├── multiview_rgb_lora_finetuning/
      #   │   └── ckpt/
      #   │       └── *.ckpt
      #   ├── depth_lora_checkpoints/
      #   ├── normal_lora_finetuning/
      #   └── ...
      - ./lora_checkpoints:/workspace/Hunyuan3D-2.1/hy3dshape/output_folder/dit/multiview_rgb_lora_finetuning/ckpt

      - ./hy3dgen:/root/.cache/hy3dgen

      # gradio 缓存
      - ./gradio_cache:/workspace/Hunyuan3D-2.1/gradio_cache

      # 输出结果
      - ./save_dir:/workspace/Hunyuan3D-2.1/save_dir

    shm_size: "16gb"
    ulimits:
      memlock: -1
      stack: 67108864

    command: >
      bash -lc "
      mkdir -p /workspace/Hunyuan3D-2.1/hy3dpaint/ckpt &&
      ln -sf /workspace/weights/realesrgan/RealESRGAN_x4plus.pth /workspace/Hunyuan3D-2.1/hy3dpaint/ckpt/RealESRGAN_x4plus.pth &&
      ./start_multiview_rgb_gradio.sh
      "
