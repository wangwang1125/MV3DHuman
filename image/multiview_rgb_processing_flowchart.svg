<?xml version="1.0" encoding="UTF-8"?>
<svg width="1600" height="1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 22px; font-weight: bold; fill: #2c3e50; }
      .subtitle { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #34495e; }
      .layer-text { font-family: Arial, sans-serif; font-size: 12px; fill: #2c3e50; }
      .param-text { font-family: Arial, sans-serif; font-size: 10px; fill: #7f8c8d; }
      .fusion-text { font-family: Arial, sans-serif; font-size: 11px; fill: #e74c3c; font-weight: bold; }
      .flow-arrow { stroke: #3498db; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .fusion-arrow { stroke: #e74c3c; stroke-width: 3; fill: none; marker-end: url(#fusion-arrowhead); }
      .data-arrow { stroke: #27ae60; stroke-width: 2; fill: none; marker-end: url(#data-arrowhead); }
      .input-box { fill: #e3f2fd; stroke: #2196f3; stroke-width: 2; rx: 8; }
      .encoder-box { fill: #f3e5f5; stroke: #9c27b0; stroke-width: 2; rx: 8; }
      .fusion-box { fill: #fff3e0; stroke: #ff9800; stroke-width: 2; rx: 8; }
      .attention-box { fill: #e8f5e8; stroke: #4caf50; stroke-width: 2; rx: 8; }
      .output-box { fill: #fce4ec; stroke: #e91e63; stroke-width: 2; rx: 8; }
      .transform-box { fill: #f1f8e9; stroke: #689f38; stroke-width: 2; rx: 8; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3498db"/>
    </marker>
    <marker id="fusion-arrowhead" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#e74c3c"/>
    </marker>
    <marker id="data-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="800" y="30" text-anchor="middle" class="title">RGB多视图特征处理架构 (DinoImageEncoderMV)</text>
  <text x="800" y="55" text-anchor="middle" class="param-text">基于DINOv2的多视角RGB图像特征提取与融合</text>

  <!-- Input Section -->
  <g id="input-section">
    <text x="50" y="100" class="subtitle">多视图RGB输入</text>
    
    <!-- View 1 -->
    <rect x="50" y="110" width="120" height="80" class="input-box"/>
    <text x="110" y="130" text-anchor="middle" class="layer-text">视角1 RGB</text>
    <text x="110" y="145" text-anchor="middle" class="param-text">(B, 3, 224, 224)</text>
    <text x="110" y="160" text-anchor="middle" class="param-text">前视角</text>
    <text x="110" y="175" text-anchor="middle" class="param-text">RGB图像</text>
    
    <!-- View 2 -->
    <rect x="200" y="110" width="120" height="80" class="input-box"/>
    <text x="260" y="130" text-anchor="middle" class="layer-text">视角2 RGB</text>
    <text x="260" y="145" text-anchor="middle" class="param-text">(B, 3, 224, 224)</text>
    <text x="260" y="160" text-anchor="middle" class="param-text">右视角</text>
    <text x="260" y="175" text-anchor="middle" class="param-text">RGB图像</text>
    
    <!-- View 3 -->
    <rect x="350" y="110" width="120" height="80" class="input-box"/>
    <text x="410" y="130" text-anchor="middle" class="layer-text">视角3 RGB</text>
    <text x="410" y="145" text-anchor="middle" class="param-text">(B, 3, 224, 224)</text>
    <text x="410" y="160" text-anchor="middle" class="param-text">后视角</text>
    <text x="410" y="175" text-anchor="middle" class="param-text">RGB图像</text>
    
    <!-- View 4 -->
    <rect x="500" y="110" width="120" height="80" class="input-box"/>
    <text x="560" y="130" text-anchor="middle" class="layer-text">视角4 RGB</text>
    <text x="560" y="145" text-anchor="middle" class="param-text">(B, 3, 224, 224)</text>
    <text x="560" y="160" text-anchor="middle" class="param-text">左视角</text>
    <text x="560" y="175" text-anchor="middle" class="param-text">RGB图像</text>
    
    <!-- Combined Input -->
    <rect x="700" y="110" width="150" height="80" class="input-box"/>
    <text x="775" y="130" text-anchor="middle" class="layer-text">多视图RGB张量</text>
    <text x="775" y="145" text-anchor="middle" class="param-text">(B, 4, 3, 224, 224)</text>
    <text x="775" y="160" text-anchor="middle" class="param-text">4个视角拼接</text>
    <text x="775" y="175" text-anchor="middle" class="param-text">360°RGB覆盖</text>
  </g>

  <!-- Preprocessing Section -->
  <g id="preprocessing">
    <text x="50" y="240" class="subtitle">预处理阶段</text>
    
    <!-- Value Range Normalization -->
    <rect x="50" y="250" width="200" height="80" class="transform-box"/>
    <text x="150" y="270" text-anchor="middle" class="layer-text">数值范围归一化</text>
    <text x="60" y="290" class="param-text">• 输入范围: (-1, 1)</text>
    <text x="60" y="305" class="param-text">• 归一化: (image - low) / (high - low)</text>
    <text x="60" y="320" class="param-text">• 输出: [0, 1]范围</text>
    
    <!-- Reshape -->
    <rect x="280" y="250" width="200" height="80" class="transform-box"/>
    <text x="380" y="270" text-anchor="middle" class="layer-text">张量重塑</text>
    <text x="290" y="290" class="param-text">• (B, 4, 3, 224, 224)</text>
    <text x="290" y="305" class="param-text">• → (B×4, 3, 224, 224)</text>
    <text x="290" y="320" class="param-text">• 批量并行处理</text>
    
    <!-- Transform -->
    <rect x="510" y="250" width="200" height="80" class="transform-box"/>
    <text x="610" y="270" text-anchor="middle" class="layer-text">DINOv2预处理</text>
    <text x="520" y="290" class="param-text">• 标准化: mean=[0.485, 0.456, 0.406]</text>
    <text x="520" y="305" class="param-text">• std=[0.229, 0.224, 0.225]</text>
    <text x="520" y="320" class="param-text">• 输出: (B×4, 3, 224, 224)</text>
  </g>

  <!-- DINOv2 Encoder Section -->
  <g id="dinov2-encoder">
    <text x="750" y="240" class="subtitle">DINOv2 视觉编码器 (共享权重)</text>
    
    <!-- Patch Embedding -->
    <rect x="750" y="250" width="200" height="100" class="encoder-box"/>
    <text x="850" y="270" text-anchor="middle" class="layer-text">Patch嵌入层</text>
    <text x="760" y="290" class="param-text">• Conv2d(3→768, k=14, s=14)</text>
    <text x="760" y="305" class="param-text">• 图像分块: 16×16 patches</text>
    <text x="760" y="320" class="param-text">• 位置编码: 2D sin-cos</text>
    <text x="760" y="335" class="param-text">• 输出: (B×4, 257, 768)</text>
    
    <!-- Transformer Blocks -->
    <rect x="980" y="250" width="200" height="100" class="encoder-box"/>
    <text x="1080" y="270" text-anchor="middle" class="layer-text">Transformer块</text>
    <text x="990" y="290" class="param-text">• 24层Transformer</text>
    <text x="990" y="305" class="param-text">• Multi-Head Attention</text>
    <text x="990" y="320" class="param-text">• Feed Forward Network</text>
    <text x="990" y="335" class="param-text">• 输出: (B×4, 257, 768)</text>
    
    <!-- Feature Extraction -->
    <rect x="1210" y="250" width="200" height="100" class="encoder-box"/>
    <text x="1310" y="270" text-anchor="middle" class="layer-text">特征提取</text>
    <text x="1220" y="290" class="param-text">• 去除CLS token</text>
    <text x="1220" y="305" class="param-text">• 保留patch tokens</text>
    <text x="1220" y="320" class="param-text">• num_patches = 256</text>
    <text x="1220" y="335" class="param-text">• 输出: (B×4, 256, 768)</text>
  </g>

  <!-- View Embedding Section -->
  <g id="view-embedding">
    <text x="50" y="400" class="subtitle">视角位置编码生成</text>
    
    <!-- Sinusoidal Embedding -->
    <rect x="50" y="410" width="250" height="120" class="attention-box"/>
    <text x="175" y="430" text-anchor="middle" class="layer-text">正弦位置编码</text>
    <text x="60" y="450" class="param-text">• 视角索引: [0, 1, 2, 3]</text>
    <text x="60" y="465" class="param-text">• get_1d_sincos_pos_embed_from_grid</text>
    <text x="60" y="480" class="param-text">• 编码维度: 768</text>
    <text x="60" y="495" class="param-text">• 基础编码: (4, 768)</text>
    <text x="60" y="510" class="param-text">• 扩展到patches: (4, 256, 768)</text>
    
    <!-- View Index Handling -->
    <rect x="320" y="410" width="250" height="120" class="attention-box"/>
    <text x="445" y="430" text-anchor="middle" class="layer-text">视角索引处理</text>
    <text x="330" y="450" class="param-text">• 支持自定义view_idxs</text>
    <text x="330" y="465" class="param-text">• 动态视角选择</text>
    <text x="330" y="480" class="param-text">• 批次级别索引</text>
    <text x="330" y="495" class="param-text">• 灵活视角数量</text>
    <text x="330" y="510" class="param-text">• 输出: (B, 4, 256, 768)</text>
    
    <!-- Embedding Addition -->
    <rect x="590" y="410" width="250" height="120" class="attention-box"/>
    <text x="715" y="430" text-anchor="middle" class="layer-text">嵌入融合</text>
    <text x="600" y="450" class="param-text">• 特征重塑: (B×4, 256, 768)</text>
    <text x="600" y="465" class="param-text">• → (B, 4, 256, 768)</text>
    <text x="600" y="480" class="param-text">• 位置编码加法</text>
    <text x="600" y="495" class="param-text">• features + view_embedding</text>
    <text x="600" y="510" class="param-text">• 输出: (B, 4, 256, 768)</text>
  </g>

  <!-- Feature Fusion Section -->
  <g id="feature-fusion">
    <text x="900" y="400" class="subtitle">多视图特征融合</text>
    
    <!-- Sequence Concatenation -->
    <rect x="900" y="410" width="300" height="120" class="fusion-box"/>
    <text x="1050" y="430" text-anchor="middle" class="fusion-text">序列拼接融合</text>
    <text x="910" y="450" class="param-text">• 视角维度展平</text>
    <text x="910" y="465" class="param-text">• (B, 4, 256, 768) → (B, 4×256, 768)</text>
    <text x="910" y="480" class="param-text">• 序列长度: 1024</text>
    <text x="910" y="495" class="param-text">• 保持patch级别信息</text>
    <text x="910" y="510" class="param-text">• 输出: (B, 1024, 768)</text>
  </g>

  <!-- Output Section -->
  <g id="output-section">
    <text x="1250" y="400" class="subtitle">最终输出</text>
    
    <rect x="1250" y="410" width="200" height="120" class="output-box"/>
    <text x="1350" y="430" text-anchor="middle" class="layer-text">多视图RGB特征</text>
    <text x="1350" y="445" text-anchor="middle" class="param-text">(B, 1024, 768)</text>
    <text x="1260" y="465" class="param-text">• 1024个patch tokens</text>
    <text x="1260" y="480" class="param-text">• 每个token: 768维</text>
    <text x="1260" y="495" class="param-text">• 包含4个视角信息</text>
    <text x="1260" y="510" class="param-text">• 适配DiT模型输入</text>
  </g>

  <!-- Detailed Architecture -->
  <g id="detailed-arch">
    <text x="50" y="580" class="subtitle">DINOv2详细架构</text>
    
    <rect x="50" y="590" width="1400" height="200" class="encoder-box"/>
    <text x="750" y="610" text-anchor="middle" class="layer-text">DINOv2-Large 详细结构</text>
    
    <!-- Input Processing -->
    <rect x="70" y="630" width="150" height="80" class="transform-box"/>
    <text x="145" y="650" text-anchor="middle" class="layer-text">输入处理</text>
    <text x="80" y="670" class="param-text">• 图像: 224×224</text>
    <text x="80" y="685" class="param-text">• Patch: 14×14</text>
    <text x="80" y="700" class="param-text">• Patches: 16×16=256</text>
    
    <!-- Patch Embedding -->
    <rect x="240" y="630" width="150" height="80" class="encoder-box"/>
    <text x="315" y="650" text-anchor="middle" class="layer-text">Patch嵌入</text>
    <text x="250" y="670" class="param-text">• Linear: 588→768</text>
    <text x="250" y="685" class="param-text">• CLS token添加</text>
    <text x="250" y="700" class="param-text">• 位置编码</text>
    
    <!-- Transformer Layers -->
    <rect x="410" y="630" width="200" height="80" class="encoder-box"/>
    <text x="510" y="650" text-anchor="middle" class="layer-text">Transformer层</text>
    <text x="420" y="670" class="param-text">• 24层 × (Attention + FFN)</text>
    <text x="420" y="685" class="param-text">• 12个注意力头</text>
    <text x="420" y="700" class="param-text">• 隐藏维度: 768</text>
    
    <!-- Multi-Head Attention -->
    <rect x="630" y="630" width="180" height="80" class="attention-box"/>
    <text x="720" y="650" text-anchor="middle" class="layer-text">多头注意力</text>
    <text x="640" y="670" class="param-text">• 头数: 12</text>
    <text x="640" y="685" class="param-text">• 头维度: 64</text>
    <text x="640" y="700" class="param-text">• 自注意力机制</text>
    
    <!-- Feed Forward -->
    <rect x="830" y="630" width="150" height="80" class="encoder-box"/>
    <text x="905" y="650" text-anchor="middle" class="layer-text">前馈网络</text>
    <text x="840" y="670" class="param-text">• 768→3072→768</text>
    <text x="840" y="685" class="param-text">• GELU激活</text>
    <text x="840" y="700" class="param-text">• Dropout</text>
    
    <!-- Layer Norm -->
    <rect x="1000" y="630" width="150" height="80" class="encoder-box"/>
    <text x="1075" y="650" text-anchor="middle" class="layer-text">层归一化</text>
    <text x="1010" y="670" class="param-text">• Pre-norm结构</text>
    <text x="1010" y="685" class="param-text">• 残差连接</text>
    <text x="1010" y="700" class="param-text">• 稳定训练</text>
    
    <!-- Output Features -->
    <rect x="1170" y="630" width="150" height="80" class="output-box"/>
    <text x="1245" y="650" text-anchor="middle" class="layer-text">输出特征</text>
    <text x="1180" y="670" class="param-text">• 去除CLS token</text>
    <text x="1180" y="685" class="param-text">• 256个patch</text>
    <text x="1180" y="700" class="param-text">• 768维特征</text>
  </g>

  <!-- Comparison with Single View -->
  <g id="comparison">
    <text x="50" y="830" class="subtitle">多视图 vs 单视图对比</text>
    
    <!-- Single View -->
    <rect x="50" y="840" width="300" height="100" class="input-box"/>
    <text x="200" y="860" text-anchor="middle" class="layer-text">单视图处理</text>
    <text x="60" y="880" class="param-text">• 输入: (B, 3, 224, 224)</text>
    <text x="60" y="895" class="param-text">• 输出: (B, 256, 768)</text>
    <text x="60" y="910" class="param-text">• 单一视角信息</text>
    <text x="60" y="925" class="param-text">• 有限的3D理解</text>
    
    <!-- Multi View -->
    <rect x="380" y="840" width="300" height="100" class="fusion-box"/>
    <text x="530" y="860" text-anchor="middle" class="fusion-text">多视图处理</text>
    <text x="390" y="880" class="param-text">• 输入: (B, 4, 3, 224, 224)</text>
    <text x="390" y="895" class="param-text">• 输出: (B, 1024, 768)</text>
    <text x="390" y="910" class="param-text">• 360°视角信息</text>
    <text x="390" y="925" class="param-text">• 丰富的3D理解</text>
    
    <!-- Advantages -->
    <rect x="710" y="840" width="400" height="100" class="attention-box"/>
    <text x="910" y="860" text-anchor="middle" class="layer-text">多视图优势</text>
    <text x="720" y="880" class="param-text">• 完整的几何信息捕获</text>
    <text x="720" y="895" class="param-text">• 视角间的一致性约束</text>
    <text x="720" y="910" class="param-text">• 更好的3D形状理解</text>
    <text x="720" y="925" class="param-text">• 减少视角遮挡问题</text>
  </g>

  <!-- Training Strategy -->
  <g id="training-strategy">
    <text x="50" y="980" class="subtitle">训练策略</text>
    
    <rect x="50" y="990" width="1400" height="80" class="attention-box"/>
    <text x="750" y="1010" text-anchor="middle" class="layer-text">DINOv2预训练权重 + 视角位置编码微调</text>
    <text x="60" y="1030" class="param-text">• 冻结DINOv2主干网络权重  • 仅训练视角位置编码参数  • 保持强大的视觉表示能力  • 快速适应多视图场景</text>
    <text x="60" y="1050" class="param-text">• 支持动态视角数量  • 灵活的视角索引配置  • 高效的批量处理  • 与DiT模型无缝集成</text>
  </g>

  <!-- Flow Arrows -->
  <g id="arrows">
    <!-- Input to preprocessing -->
    <line x1="775" y1="190" x2="150" y2="250" class="data-arrow"/>
    
    <!-- Preprocessing chain -->
    <line x1="250" y1="290" x2="280" y2="290" class="flow-arrow"/>
    <line x1="480" y1="290" x2="510" y2="290" class="flow-arrow"/>
    <line x1="710" y1="290" x2="750" y2="300" class="flow-arrow"/>
    
    <!-- DINOv2 encoder chain -->
    <line x1="950" y1="300" x2="980" y2="300" class="flow-arrow"/>
    <line x1="1180" y1="300" x2="1210" y2="300" class="flow-arrow"/>
    
    <!-- To view embedding -->
    <line x1="1310" y1="350" x2="715" y2="410" class="flow-arrow"/>
    
    <!-- View embedding chain -->
    <line x1="300" y1="470" x2="320" y2="470" class="data-arrow"/>
    <line x1="570" y1="470" x2="590" y2="470" class="data-arrow"/>
    
    <!-- To fusion -->
    <line x1="840" y1="470" x2="900" y2="470" class="fusion-arrow"/>
    
    <!-- To output -->
    <line x1="1200" y1="470" x2="1250" y2="470" class="flow-arrow"/>
    
    <!-- Detailed architecture arrows -->
    <line x1="145" y1="710" x2="240" y2="670" class="flow-arrow"/>
    <line x1="315" y1="710" x2="410" y2="670" class="flow-arrow"/>
    <line x1="510" y1="710" x2="630" y2="670" class="flow-arrow"/>
    <line x1="720" y1="710" x2="830" y2="670" class="flow-arrow"/>
    <line x1="905" y1="710" x2="1000" y2="670" class="flow-arrow"/>
    <line x1="1075" y1="710" x2="1170" y2="670" class="flow-arrow"/>
  </g>

  <!-- Key Features -->
  <g id="key-features">
    <text x="50" y="1120" class="subtitle">关键特性</text>
    
    <rect x="50" y="1130" width="1500" height="15" style="fill: #fff3cd; stroke: #ffc107; stroke-width: 1; rx: 4;"/>
    <text x="60" y="1142" class="param-text">✓ 基于DINOv2强大的视觉表示  ✓ 支持4个视角的RGB图像处理  ✓ 正弦位置编码区分视角  ✓ 序列拼接保持patch级信息  ✓ 输出1024×768特征适配DiT</text>
  </g>

</svg>