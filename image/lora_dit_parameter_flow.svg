<?xml version="1.0" encoding="UTF-8"?>
<svg width="1400" height="1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #2c3e50; }
      .subtitle { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #34495e; }
      .layer-text { font-family: Arial, sans-serif; font-size: 12px; fill: #2c3e50; }
      .param-text { font-family: Arial, sans-serif; font-size: 10px; fill: #7f8c8d; }
      .lora-text { font-family: Arial, sans-serif; font-size: 10px; fill: #e74c3c; font-weight: bold; }
      .flow-arrow { stroke: #3498db; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .lora-arrow { stroke: #e74c3c; stroke-width: 2; fill: none; marker-end: url(#lora-arrowhead); }
      .data-arrow { stroke: #27ae60; stroke-width: 2; fill: none; marker-end: url(#data-arrowhead); }
      .layer-box { fill: #ecf0f1; stroke: #bdc3c7; stroke-width: 2; rx: 8; }
      .lora-box { fill: #fdf2f2; stroke: #e74c3c; stroke-width: 2; rx: 6; }
      .attention-box { fill: #e8f5e8; stroke: #27ae60; stroke-width: 2; rx: 8; }
      .input-box { fill: #e3f2fd; stroke: #2196f3; stroke-width: 2; rx: 8; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3498db"/>
    </marker>
    <marker id="lora-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
    <marker id="data-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="700" y="30" text-anchor="middle" class="title">LoRA层与DiT模型参数影响流程图</text>
  <text x="700" y="50" text-anchor="middle" class="param-text">基于 HunYuan3D-2.1 深度条件LoRA微调架构</text>

  <!-- Input Data Flow -->
  <g id="input-section">
    <text x="50" y="90" class="subtitle">输入数据流</text>
    
    <!-- Depth Input -->
    <rect x="50" y="100" width="120" height="60" class="input-box"/>
    <text x="110" y="120" text-anchor="middle" class="layer-text">深度图输入</text>
    <text x="110" y="135" text-anchor="middle" class="param-text">(B, 1, H, W)</text>
    <text x="110" y="150" text-anchor="middle" class="param-text">EXR格式</text>

    <!-- RGB Input -->
    <rect x="200" y="100" width="120" height="60" class="input-box"/>
    <text x="260" y="120" text-anchor="middle" class="layer-text">RGB图像输入</text>
    <text x="260" y="135" text-anchor="middle" class="param-text">(B, 3, H, W)</text>
    <text x="260" y="150" text-anchor="middle" class="param-text">DINO-v2特征</text>
  </g>

  <!-- ControlNet Section -->
  <g id="controlnet-section">
    <text x="50" y="220" class="subtitle">ControlNet深度特征提取</text>
    
    <rect x="50" y="230" width="270" height="80" class="layer-box"/>
    <text x="185" y="250" text-anchor="middle" class="layer-text">DepthControlNet</text>
    <text x="70" y="270" class="param-text">• Conv2d(1→64→128→256)</text>
    <text x="70" y="285" class="param-text">• Linear(256→768) - depth_encoder</text>
    <text x="70" y="300" class="param-text">• Linear(768→768) - seq_expand</text>
    <text x="250" y="270" class="lora-text">❌ 无LoRA影响</text>
    <text x="250" y="285" class="param-text">全参数训练</text>
    <text x="250" y="300" class="param-text">输出: (B, 1, 768)</text>
  </g>

  <!-- Feature Processing -->
  <g id="feature-processing">
    <text x="400" y="220" class="subtitle">特征处理与融合</text>
    
    <!-- Additional Cond Proj -->
    <rect x="400" y="230" width="180" height="60" class="layer-box"/>
    <text x="490" y="250" text-anchor="middle" class="layer-text">additional_cond_proj</text>
    <text x="490" y="265" text-anchor="middle" class="param-text">Linear(768→1024)</text>
    <text x="490" y="280" text-anchor="middle" class="param-text">深度特征维度对齐</text>

    <!-- Context Concatenation -->
    <rect x="620" y="230" width="160" height="60" class="layer-box"/>
    <text x="700" y="250" text-anchor="middle" class="layer-text">Context拼接</text>
    <text x="700" y="265" text-anchor="middle" class="param-text">[RGB_feat, Depth_feat]</text>
    <text x="700" y="280" text-anchor="middle" class="param-text">(B, seq_len, 1024)</text>
  </g>

  <!-- DiT Model Structure -->
  <g id="dit-model">
    <text x="50" y="360" class="subtitle">DiT模型结构 (24个DiT块)</text>
    
    <!-- Single DiT Block Detail -->
    <rect x="50" y="370" width="1300" height="200" class="attention-box"/>
    <text x="700" y="390" text-anchor="middle" class="layer-text">HunYuanDiTBlock × 24</text>
    
    <!-- Self-Attention -->
    <g id="self-attention">
      <rect x="80" y="410" width="200" height="140" class="layer-box"/>
      <text x="180" y="430" text-anchor="middle" class="subtitle">Self-Attention</text>
      
      <!-- LoRA affected layers -->
      <rect x="90" y="440" width="80" height="25" class="lora-box"/>
      <text x="130" y="455" text-anchor="middle" class="lora-text">to_q + LoRA</text>
      
      <rect x="190" y="440" width="80" height="25" class="lora-box"/>
      <text x="230" y="455" text-anchor="middle" class="lora-text">to_k + LoRA</text>
      
      <rect x="90" y="475" width="80" height="25" class="lora-box"/>
      <text x="130" y="490" text-anchor="middle" class="lora-text">to_v + LoRA</text>
      
      <rect x="190" y="475" width="80" height="25" class="lora-box"/>
      <text x="230" y="490" text-anchor="middle" class="lora-text">out_proj + LoRA</text>
      
      <text x="180" y="520" text-anchor="middle" class="param-text">维度: (1024→1024)</text>
      <text x="180" y="535" text-anchor="middle" class="param-text">LoRA rank: 8</text>
    </g>

    <!-- Cross-Attention -->
    <g id="cross-attention">
      <rect x="320" y="410" width="200" height="140" class="layer-box"/>
      <text x="420" y="430" text-anchor="middle" class="subtitle">Cross-Attention</text>
      
      <!-- LoRA affected layers -->
      <rect x="330" y="440" width="80" height="25" class="lora-box"/>
      <text x="370" y="455" text-anchor="middle" class="lora-text">to_q + LoRA</text>
      
      <rect x="430" y="440" width="80" height="25" class="lora-box"/>
      <text x="470" y="455" text-anchor="middle" class="lora-text">to_k + LoRA</text>
      
      <rect x="330" y="475" width="80" height="25" class="lora-box"/>
      <text x="370" y="490" text-anchor="middle" class="lora-text">to_v + LoRA</text>
      
      <rect x="430" y="475" width="80" height="25" class="lora-box"/>
      <text x="470" y="490" text-anchor="middle" class="lora-text">out_proj + LoRA</text>
      
      <text x="420" y="520" text-anchor="middle" class="param-text">Q维度: (1024→1024)</text>
      <text x="420" y="535" text-anchor="middle" class="param-text">K,V维度: (1024→1024)</text>
    </g>

    <!-- MLP/FFN -->
    <g id="mlp">
      <rect x="560" y="410" width="150" height="140" class="layer-box"/>
      <text x="635" y="430" text-anchor="middle" class="subtitle">MLP/FFN</text>
      <text x="635" y="450" text-anchor="middle" class="param-text">❌ 无LoRA影响</text>
      <text x="635" y="470" text-anchor="middle" class="param-text">Linear(1024→4096)</text>
      <text x="635" y="485" text-anchor="middle" class="param-text">GELU激活</text>
      <text x="635" y="500" text-anchor="middle" class="param-text">Linear(4096→1024)</text>
      <text x="635" y="520" text-anchor="middle" class="param-text">固定参数</text>
      <text x="635" y="535" text-anchor="middle" class="param-text">不参与LoRA训练</text>
    </g>

    <!-- Normalization Layers -->
    <g id="norm-layers">
      <rect x="750" y="410" width="120" height="140" class="layer-box"/>
      <text x="810" y="430" text-anchor="middle" class="subtitle">归一化层</text>
      <text x="810" y="450" text-anchor="middle" class="param-text">LayerNorm</text>
      <text x="810" y="465" text-anchor="middle" class="param-text">RMSNorm</text>
      <text x="810" y="485" text-anchor="middle" class="param-text">❌ 无LoRA影响</text>
      <text x="810" y="505" text-anchor="middle" class="param-text">固定参数</text>
    </g>

    <!-- Skip Connections -->
    <g id="skip-connections">
      <rect x="910" y="410" width="120" height="140" class="layer-box"/>
      <text x="970" y="430" text-anchor="middle" class="subtitle">残差连接</text>
      <text x="970" y="450" text-anchor="middle" class="param-text">x + attn(x)</text>
      <text x="970" y="465" text-anchor="middle" class="param-text">x + mlp(x)</text>
      <text x="970" y="485" text-anchor="middle" class="param-text">❌ 无参数</text>
      <text x="970" y="505" text-anchor="middle" class="param-text">纯计算操作</text>
    </g>

    <!-- Timestep Embedding -->
    <g id="timestep-emb">
      <rect x="1070" y="410" width="120" height="140" class="layer-box"/>
      <text x="1130" y="430" text-anchor="middle" class="subtitle">时间步嵌入</text>
      <text x="1130" y="450" text-anchor="middle" class="param-text">TimestepEmbedder</text>
      <text x="1130" y="465" text-anchor="middle" class="param-text">SiLU + Linear</text>
      <text x="1130" y="485" text-anchor="middle" class="param-text">❌ 无LoRA影响</text>
      <text x="1130" y="505" text-anchor="middle" class="param-text">固定参数</text>
    </g>

    <!-- Block Repetition Indicator -->
    <text x="700" y="580" text-anchor="middle" class="subtitle">↓ 重复24次 ↓</text>
  </g>

  <!-- LoRA Parameter Details -->
  <g id="lora-details">
    <text x="50" y="630" class="subtitle">LoRA参数详细信息</text>
    
    <rect x="50" y="640" width="600" height="120" class="lora-box"/>
    <text x="350" y="660" text-anchor="middle" class="subtitle">LoRA配置与参数统计</text>
    
    <text x="70" y="680" class="layer-text">• target_modules: ["to_q", "to_k", "to_v", "to_out.0"]</text>
    <text x="70" y="695" class="layer-text">• rank (r): 8</text>
    <text x="70" y="710" class="layer-text">• lora_alpha: 8</text>
    <text x="70" y="725" class="layer-text">• 总LoRA适配器数量: 24块 × 2种注意力 × 4个线性层 = 192个</text>
    <text x="70" y="740" class="layer-text">• 每个LoRA适配器参数量: 1024 × 8 × 2 = 16,384</text>
    <text x="70" y="755" class="layer-text">• 总LoRA参数量: 192 × 16,384 ≈ 3.15M 参数</text>
  </g>

  <!-- Training Process -->
  <g id="training-process">
    <text x="700" y="630" class="subtitle">训练过程中的参数更新</text>
    
    <rect x="700" y="640" width="650" height="120" class="attention-box"/>
    <text x="1025" y="660" text-anchor="middle" class="subtitle">梯度反传与参数更新</text>
    
    <text x="720" y="680" class="layer-text">1. 前向传播: 深度条件 → ControlNet → DiT(LoRA增强) → 输出</text>
    <text x="720" y="695" class="layer-text">2. 损失计算: transport.training_losses(model, latents, contexts)</text>
    <text x="720" y="710" class="layer-text">3. 梯度反传: ∂Loss/∂LoRA_params (只更新LoRA参数)</text>
    <text x="720" y="725" class="layer-text">4. 参数更新: LoRA_W = LoRA_W - lr × gradient</text>
    <text x="720" y="740" class="layer-text">5. 固定参数: DiT主干网络权重保持不变</text>
    <text x="720" y="755" class="layer-text">6. ControlNet: 全参数训练 (无LoRA影响)</text>
  </g>

  <!-- Data Flow Arrows -->
  <g id="arrows">
    <!-- Input to ControlNet -->
    <line x1="110" y1="160" x2="110" y2="230" class="data-arrow"/>
    
    <!-- ControlNet to Feature Processing -->
    <line x1="185" y1="310" x2="400" y2="260" class="flow-arrow"/>
    
    <!-- RGB to Context -->
    <line x1="260" y1="160" x2="620" y2="260" class="data-arrow"/>
    
    <!-- Feature Processing to DiT -->
    <line x1="700" y1="290" x2="700" y2="370" class="flow-arrow"/>
    
    <!-- LoRA influence arrows -->
    <line x1="350" y1="680" x2="180" y2="550" class="lora-arrow"/>
    <line x1="350" y1="680" x2="420" y2="550" class="lora-arrow"/>
    
    <!-- Training process arrows -->
    <line x1="1025" y1="640" x2="700" y2="570" class="data-arrow"/>
  </g>

  <!-- Legend -->
  <g id="legend">
    <text x="50" y="820" class="subtitle">图例说明</text>
    
    <rect x="50" y="830" width="20" height="15" class="lora-box"/>
    <text x="80" y="842" class="layer-text">LoRA影响的层</text>
    
    <rect x="200" y="830" width="20" height="15" class="layer-box"/>
    <text x="230" y="842" class="layer-text">固定参数层</text>
    
    <rect x="350" y="830" width="20" height="15" class="attention-box"/>
    <text x="380" y="842" class="layer-text">注意力机制</text>
    
    <rect x="500" y="830" width="20" height="15" class="input-box"/>
    <text x="530" y="842" class="layer-text">输入数据</text>
    
    <line x1="650" y1="837" x2="680" y2="837" class="lora-arrow"/>
    <text x="690" y="842" class="layer-text">LoRA参数流</text>
    
    <line x1="800" y1="837" x2="830" y2="837" class="flow-arrow"/>
    <text x="840" y="842" class="layer-text">数据流</text>
    
    <line x1="950" y1="837" x2="980" y2="837" class="data-arrow"/>
    <text x="990" y="842" class="layer-text">特征流</text>
  </g>

  <!-- Key Insights -->
  <g id="insights">
    <text x="50" y="890" class="subtitle">关键要点</text>
    
    <rect x="50" y="900" width="1300" height="280" style="fill: #fff3cd; stroke: #ffc107; stroke-width: 2; rx: 8;"/>
    
    <text x="700" y="920" text-anchor="middle" class="subtitle">深度条件如何通过LoRA影响DiT模型</text>
    
    <text x="70" y="950" class="layer-text">1. 深度条件传递路径:</text>
    <text x="90" y="970" class="param-text">深度EXR → ControlNet(全参数) → 768维特征 → additional_cond_proj → 1024维特征 → 与RGB特征拼接</text>
    
    <text x="70" y="1000" class="layer-text">2. LoRA影响机制:</text>
    <text x="90" y="1020" class="param-text">• 不同深度条件 → 不同的K、V矩阵 → 不同的注意力模式 → 不同的模型输出</text>
    <text x="90" y="1035" class="param-text">• 训练时: 不同深度条件产生不同梯度 → LoRA参数学会适应深度信息</text>
    
    <text x="70" y="1065" class="layer-text">3. 参数训练策略:</text>
    <text x="90" y="1085" class="param-text">• ControlNet: 全参数训练 (学习深度特征提取)</text>
    <text x="90" y="1100" class="param-text">• DiT主干: 固定参数 (保持预训练知识)</text>
    <text x="90" y="1115" class="param-text">• LoRA适配器: 可训练参数 (学习深度条件融合)</text>
    
    <text x="70" y="1145" class="layer-text">4. 效果实现:</text>
    <text x="90" y="1165" class="param-text">• LoRA使DiT模型能够根据深度信息调整注意力权重，实现深度条件的3D生成</text>
  </g>

</svg>