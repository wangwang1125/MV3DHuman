<?xml version="1.0" encoding="UTF-8"?>
<svg width="1600" height="1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 22px; font-weight: bold; fill: #2c3e50; }
      .subtitle { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #34495e; }
      .layer-text { font-family: Arial, sans-serif; font-size: 12px; fill: #2c3e50; }
      .param-text { font-family: Arial, sans-serif; font-size: 10px; fill: #7f8c8d; }
      .fusion-text { font-family: Arial, sans-serif; font-size: 11px; fill: #e74c3c; font-weight: bold; }
      .flow-arrow { stroke: #3498db; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .fusion-arrow { stroke: #e74c3c; stroke-width: 3; fill: none; marker-end: url(#fusion-arrowhead); }
      .data-arrow { stroke: #27ae60; stroke-width: 2; fill: none; marker-end: url(#data-arrowhead); }
      .input-box { fill: #e3f2fd; stroke: #2196f3; stroke-width: 2; rx: 8; }
      .encoder-box { fill: #f3e5f5; stroke: #9c27b0; stroke-width: 2; rx: 8; }
      .fusion-box { fill: #fff3e0; stroke: #ff9800; stroke-width: 2; rx: 8; }
      .attention-box { fill: #e8f5e8; stroke: #4caf50; stroke-width: 2; rx: 8; }
      .output-box { fill: #fce4ec; stroke: #e91e63; stroke-width: 2; rx: 8; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3498db"/>
    </marker>
    <marker id="fusion-arrowhead" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#e74c3c"/>
    </marker>
    <marker id="data-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="800" y="30" text-anchor="middle" class="title">深度图多视图处理架构 (MultiViewDepthControlNet)</text>
  <text x="800" y="55" text-anchor="middle" class="param-text">多视角深度信息融合与特征提取流程</text>

  <!-- Input Section -->
  <g id="input-section">
    <text x="50" y="100" class="subtitle">多视图深度输入</text>
    
    <!-- View 1 -->
    <rect x="50" y="110" width="120" height="80" class="input-box"/>
    <text x="110" y="130" text-anchor="middle" class="layer-text">视角1深度图</text>
    <text x="110" y="145" text-anchor="middle" class="param-text">(B, 1, H, W)</text>
    <text x="110" y="160" text-anchor="middle" class="param-text">EXR格式</text>
    <text x="110" y="175" text-anchor="middle" class="param-text">前视角</text>
    
    <!-- View 2 -->
    <rect x="200" y="110" width="120" height="80" class="input-box"/>
    <text x="260" y="130" text-anchor="middle" class="layer-text">视角2深度图</text>
    <text x="260" y="145" text-anchor="middle" class="param-text">(B, 1, H, W)</text>
    <text x="260" y="160" text-anchor="middle" class="param-text">EXR格式</text>
    <text x="260" y="175" text-anchor="middle" class="param-text">右视角</text>
    
    <!-- View 3 -->
    <rect x="350" y="110" width="120" height="80" class="input-box"/>
    <text x="410" y="130" text-anchor="middle" class="layer-text">视角3深度图</text>
    <text x="410" y="145" text-anchor="middle" class="param-text">(B, 1, H, W)</text>
    <text x="410" y="160" text-anchor="middle" class="param-text">EXR格式</text>
    <text x="410" y="175" text-anchor="middle" class="param-text">后视角</text>
    
    <!-- View 4 -->
    <rect x="500" y="110" width="120" height="80" class="input-box"/>
    <text x="560" y="130" text-anchor="middle" class="layer-text">视角4深度图</text>
    <text x="560" y="145" text-anchor="middle" class="param-text">(B, 1, H, W)</text>
    <text x="560" y="160" text-anchor="middle" class="param-text">EXR格式</text>
    <text x="560" y="175" text-anchor="middle" class="param-text">左视角</text>
    
    <!-- Combined Input -->
    <rect x="700" y="110" width="150" height="80" class="input-box"/>
    <text x="775" y="130" text-anchor="middle" class="layer-text">多视图深度张量</text>
    <text x="775" y="145" text-anchor="middle" class="param-text">(B, 4, 1, H, W)</text>
    <text x="775" y="160" text-anchor="middle" class="param-text">4个视角拼接</text>
    <text x="775" y="175" text-anchor="middle" class="param-text">360°覆盖</text>
  </g>

  <!-- Reshape Section -->
  <g id="reshape-section">
    <text x="50" y="240" class="subtitle">批处理重塑</text>
    
    <rect x="50" y="250" width="200" height="60" class="encoder-box"/>
    <text x="150" y="270" text-anchor="middle" class="layer-text">张量重塑</text>
    <text x="150" y="285" text-anchor="middle" class="param-text">(B, 4, 1, H, W) → (B×4, 1, H, W)</text>
    <text x="150" y="300" text-anchor="middle" class="param-text">批量并行处理</text>
  </g>

  <!-- Depth Encoder Section -->
  <g id="encoder-section">
    <text x="350" y="240" class="subtitle">深度特征编码器 (共享权重)</text>
    
    <!-- Conv Block 1 -->
    <rect x="350" y="250" width="180" height="100" class="encoder-box"/>
    <text x="440" y="270" text-anchor="middle" class="layer-text">卷积块1</text>
    <text x="360" y="290" class="param-text">• Conv2d(1→32, k=3, p=1)</text>
    <text x="360" y="305" class="param-text">• ReLU</text>
    <text x="360" y="320" class="param-text">• Conv2d(32→64, k=3, s=2, p=1)</text>
    <text x="360" y="335" class="param-text">• 输出: (B×4, 64, H/2, W/2)</text>
    
    <!-- Conv Block 2 -->
    <rect x="560" y="250" width="180" height="100" class="encoder-box"/>
    <text x="650" y="270" text-anchor="middle" class="layer-text">卷积块2</text>
    <text x="570" y="290" class="param-text">• Conv2d(64→128, k=3, s=2, p=1)</text>
    <text x="570" y="305" class="param-text">• ReLU</text>
    <text x="570" y="320" class="param-text">• Conv2d(128→256, k=3, s=2, p=1)</text>
    <text x="570" y="335" class="param-text">• 输出: (B×4, 256, H/8, W/8)</text>
    
    <!-- Conv Block 3 -->
    <rect x="770" y="250" width="180" height="100" class="encoder-box"/>
    <text x="860" y="270" text-anchor="middle" class="layer-text">卷积块3</text>
    <text x="780" y="290" class="param-text">• Conv2d(256→256, k=3, s=2, p=1)</text>
    <text x="780" y="305" class="param-text">• ReLU</text>
    <text x="780" y="320" class="param-text">• AdaptiveAvgPool2d(1,1)</text>
    <text x="780" y="335" class="param-text">• 输出: (B×4, 256)</text>
  </g>

  <!-- View Embedding Section -->
  <g id="view-embedding">
    <text x="1000" y="240" class="subtitle">视角位置编码</text>
    
    <rect x="1000" y="250" width="200" height="100" class="attention-box"/>
    <text x="1100" y="270" text-anchor="middle" class="layer-text">视角嵌入层</text>
    <text x="1010" y="290" class="param-text">• Embedding(4, 256)</text>
    <text x="1010" y="305" class="param-text">• 视角索引: [0, 1, 2, 3]</text>
    <text x="1010" y="320" class="param-text">• 位置编码: (4, 256)</text>
    <text x="1010" y="335" class="param-text">• 广播到: (B, 4, 256)</text>
  </g>

  <!-- Feature Enhancement -->
  <g id="feature-enhancement">
    <text x="50" y="400" class="subtitle">特征增强</text>
    
    <rect x="50" y="410" width="300" height="80" class="attention-box"/>
    <text x="200" y="430" text-anchor="middle" class="layer-text">视角特征 + 位置编码</text>
    <text x="60" y="450" class="param-text">• 重塑视角特征: (B×4, 256) → (B, 4, 256)</text>
    <text x="60" y="465" class="param-text">• 特征融合: view_features + view_embeddings</text>
    <text x="60" y="480" class="param-text">• 增强特征: (B, 4, 256)</text>
  </g>

  <!-- Fusion Strategies -->
  <g id="fusion-strategies">
    <text x="400" y="400" class="subtitle">多视图融合策略</text>
    
    <!-- Attention Fusion -->
    <rect x="400" y="410" width="200" height="120" class="fusion-box"/>
    <text x="500" y="430" text-anchor="middle" class="fusion-text">注意力融合</text>
    <text x="410" y="450" class="param-text">• 全局聚合Token</text>
    <text x="410" y="465" class="param-text">• Multi-Head Attention</text>
    <text x="410" y="480" class="param-text">• Q,K,V: (B, 5, 256)</text>
    <text x="410" y="495" class="param-text">• 输出: (B, 256)</text>
    <text x="410" y="510" class="param-text">• 自适应权重学习</text>
    
    <!-- Weighted Fusion -->
    <rect x="620" y="410" width="200" height="120" class="fusion-box"/>
    <text x="720" y="430" text-anchor="middle" class="fusion-text">加权融合</text>
    <text x="630" y="450" class="param-text">• 注意力权重网络</text>
    <text x="630" y="465" class="param-text">• Linear(256→64→1)</text>
    <text x="630" y="480" class="param-text">• Softmax归一化</text>
    <text x="630" y="495" class="param-text">• 加权求和</text>
    <text x="630" y="510" class="param-text">• 输出: (B, 256)</text>
    
    <!-- Concat Fusion -->
    <rect x="840" y="410" width="200" height="120" class="fusion-box"/>
    <text x="940" y="430" text-anchor="middle" class="fusion-text">拼接融合</text>
    <text x="850" y="450" class="param-text">• 特征拼接</text>
    <text x="850" y="465" class="param-text">• (B, 4×256) = (B, 1024)</text>
    <text x="850" y="480" class="param-text">• Linear(1024→768)</text>
    <text x="850" y="495" class="param-text">• 降维投影</text>
    <text x="850" y="510" class="param-text">• 输出: (B, 768)</text>
    
    <!-- Average Fusion -->
    <rect x="1060" y="410" width="200" height="120" class="fusion-box"/>
    <text x="1160" y="430" text-anchor="middle" class="fusion-text">平均融合</text>
    <text x="1070" y="450" class="param-text">• 简单平均</text>
    <text x="1070" y="465" class="param-text">• mean(dim=1)</text>
    <text x="1070" y="480" class="param-text">• (B, 4, 256) → (B, 256)</text>
    <text x="1070" y="495" class="param-text">• Linear(256→768)</text>
    <text x="1070" y="510" class="param-text">• 输出: (B, 768)</text>
  </g>

  <!-- Final Projection -->
  <g id="final-projection">
    <text x="400" y="580" class="subtitle">最终投影</text>
    
    <rect x="400" y="590" width="400" height="80" class="output-box"/>
    <text x="600" y="610" text-anchor="middle" class="layer-text">最终特征投影</text>
    <text x="410" y="630" class="param-text">• Linear(融合维度 → 768)</text>
    <text x="410" y="645" class="param-text">• 统一输出维度</text>
    <text x="410" y="660" class="param-text">• 输出: (B, 768) - 单一特征向量</text>
    <text x="600" y="660" class="param-text">准备进行Token扩展</text>
  </g>

  <!-- Token Expansion Section (NEW!) -->
  <g id="token-expansion">
    <text x="900" y="580" class="subtitle">🆕 Token扩展层 (生成16个多样化token)</text>
    
    <!-- Learnable Queries -->
    <rect x="900" y="590" width="200" height="80" class="attention-box"/>
    <text x="1000" y="610" text-anchor="middle" class="fusion-text">可学习Queries</text>
    <text x="910" y="630" class="param-text">• nn.Parameter(1,16,768)</text>
    <text x="910" y="645" class="param-text">• 初始化: randn * 0.02</text>
    <text x="910" y="660" class="param-text">• 扩展到: (B, 16, 768)</text>
    
    <!-- Cross-Attention -->
    <rect x="1120" y="590" width="220" height="80" class="attention-box"/>
    <text x="1230" y="610" text-anchor="middle" class="fusion-text">Cross-Attention</text>
    <text x="1130" y="630" class="param-text">• Query: (B, 16, 768)</text>
    <text x="1130" y="645" class="param-text">• Key/Value: (B, 1, 768)</text>
    <text x="1130" y="660" class="param-text">• 8 heads, dropout=0.0</text>
    
    <!-- Layer Norm + Residual -->
    <rect x="1360" y="590" width="200" height="80" class="attention-box"/>
    <text x="1460" y="610" text-anchor="middle" class="fusion-text">归一化 + 残差</text>
    <text x="1370" y="630" class="param-text">• Residual: out + queries</text>
    <text x="1370" y="645" class="param-text">• LayerNorm(768)</text>
    <text x="1370" y="660" class="param-text">• 输出: (B, 16, 768)</text>
  </g>

  <!-- Output Section (UPDATED!) -->
  <g id="output-section">
    <text x="50" y="720" class="subtitle">🎯 最终输出 (16个多样化深度token)</text>
    
    <rect x="50" y="730" width="250" height="100" class="output-box"/>
    <text x="175" y="755" text-anchor="middle" class="layer-text">多样化深度Token序列</text>
    <text x="60" y="775" class="param-text">• 形状: (B, 16, 768)</text>
    <text x="60" y="790" class="param-text">• 16个token各不相同</text>
    <text x="60" y="805" class="param-text">• 每个token编码深度的不同方面</text>
    <text x="60" y="820" class="param-text">• 匹配DCA的decoupled_ca_dim=16</text>
  </g>

  <!-- Token Expansion Detail -->
  <g id="token-expansion-detail">
    <text x="350" y="720" class="subtitle">Token扩展详细机制 (为什么需要16个不同的token?)</text>
    
    <rect x="350" y="730" width="1200" height="180" class="attention-box"/>
    <text x="950" y="750" text-anchor="middle" class="layer-text">可学习Token生成流程 (推荐方案 ✅)</text>
    
    <!-- Step 1: Depth Feature -->
    <rect x="370" y="770" width="150" height="60" class="fusion-box"/>
    <text x="445" y="790" text-anchor="middle" class="fusion-text">1. 深度特征</text>
    <text x="445" y="805" text-anchor="middle" class="param-text">(B, 768)</text>
    <text x="445" y="820" text-anchor="middle" class="param-text">融合的深度信息</text>
    
    <!-- Step 2: Learnable Queries -->
    <rect x="540" y="770" width="160" height="60" class="fusion-box"/>
    <text x="620" y="790" text-anchor="middle" class="fusion-text">2. 可学习Query</text>
    <text x="620" y="805" text-anchor="middle" class="param-text">(B, 16, 768)</text>
    <text x="620" y="820" text-anchor="middle" class="param-text">16个不同query</text>
    
    <!-- Step 3: Cross-Attention -->
    <rect x="720" y="770" width="170" height="60" class="fusion-box"/>
    <text x="805" y="785" text-anchor="middle" class="fusion-text">3. Cross-Attn</text>
    <text x="805" y="800" text-anchor="middle" class="param-text">Q: queries</text>
    <text x="805" y="815" text-anchor="middle" class="param-text">K,V: depth_feat</text>
    <text x="805" y="825" text-anchor="middle" class="param-text">8 heads</text>
    
    <!-- Step 4: Residual + Norm -->
    <rect x="910" y="770" width="160" height="60" class="fusion-box"/>
    <text x="990" y="790" text-anchor="middle" class="fusion-text">4. Residual+LN</text>
    <text x="990" y="805" text-anchor="middle" class="param-text">out + queries</text>
    <text x="990" y="820" text-anchor="middle" class="param-text">LayerNorm</text>
    
    <!-- Step 5: Output -->
    <rect x="1090" y="770" width="180" height="60" class="output-box"/>
    <text x="1180" y="785" text-anchor="middle" class="layer-text">5. 16个Token</text>
    <text x="1180" y="800" text-anchor="middle" class="param-text">(B, 16, 768)</text>
    <text x="1180" y="815" text-anchor="middle" class="param-text">✅ 各不相同</text>
    <text x="1180" y="825" text-anchor="middle" class="param-text">✅ DCA有效</text>
    
    <!-- Bad approach comparison -->
    <rect x="370" y="845" width="900" height="50" style="fill: #ffebee; stroke: #f44336; stroke-width: 2; rx: 8;"/>
    <text x="380" y="865" class="param-text">❌ 简单重复方案: depth_feat.repeat(1, 16, 1) → 16个完全相同的token → DCA的attention退化</text>
    <text x="380" y="880" class="param-text">✅ 可学习生成: 每个query学习关注深度的不同方面 → 例如: 整体深度/细节/边缘/平滑区域等</text>
  </g>

  <!-- Flow Arrows -->
  <g id="arrows">
    <!-- Input to reshape -->
    <line x1="775" y1="190" x2="150" y2="250" class="data-arrow"/>
    
    <!-- Reshape to encoder -->
    <line x1="250" y1="280" x2="350" y2="300" class="flow-arrow"/>
    
    <!-- Encoder chain -->
    <line x1="530" y1="300" x2="560" y2="300" class="flow-arrow"/>
    <line x1="740" y1="300" x2="770" y2="300" class="flow-arrow"/>
    
    <!-- Encoder to enhancement -->
    <line x1="860" y1="350" x2="200" y2="410" class="flow-arrow"/>
    
    <!-- View embedding to enhancement -->
    <line x1="1100" y1="350" x2="300" y2="410" class="data-arrow"/>
    
    <!-- Enhancement to fusion strategies -->
    <line x1="350" y1="450" x2="400" y2="470" class="fusion-arrow"/>
    <line x1="350" y1="450" x2="620" y2="470" class="fusion-arrow"/>
    <line x1="350" y1="450" x2="840" y2="470" class="fusion-arrow"/>
    <line x1="350" y1="450" x2="1060" y2="470" class="fusion-arrow"/>
    
    <!-- Fusion to final projection -->
    <line x1="500" y1="530" x2="500" y2="590" class="fusion-arrow"/>
    <line x1="720" y1="530" x2="600" y2="590" class="fusion-arrow"/>
    <line x1="940" y1="530" x2="700" y2="590" class="fusion-arrow"/>
    <line x1="1160" y1="530" x2="750" y2="590" class="fusion-arrow"/>
    
    <!-- Final projection to Token Expansion -->
    <line x1="800" y1="630" x2="1000" y2="590" class="flow-arrow"/>
    
    <!-- Token Expansion internal arrows -->
    <line x1="1100" y1="630" x2="1230" y2="590" class="fusion-arrow"/>
    <line x1="1340" y1="630" x2="1460" y2="590" class="fusion-arrow"/>
    
    <!-- Token Expansion to Output -->
    <line x1="1460" y1="670" x2="175" y2="730" class="flow-arrow"/>
    
    <!-- Token generation detail arrows -->
    <line x1="520" y1="800" x2="540" y2="800" class="fusion-arrow"/>
    <line x1="700" y1="800" x2="720" y2="800" class="fusion-arrow"/>
    <line x1="890" y1="800" x2="910" y2="800" class="fusion-arrow"/>
    <line x1="1070" y1="800" x2="1090" y2="800" class="fusion-arrow"/>
  </g>

  <!-- Key Features -->
  <g id="key-features">
    <text x="50" y="930" class="subtitle">关键特性与优势</text>
    
    <rect x="50" y="940" width="1500" height="30" style="fill: #fff3cd; stroke: #ffc107; stroke-width: 1; rx: 4;"/>
    <text x="60" y="952" class="param-text">✓ 支持4个视角的深度图同时处理  ✓ 共享权重的深度编码器确保一致性  ✓ 视角位置编码区分不同视角  ✓ 多种融合策略可选</text>
    <text x="60" y="965" class="param-text">🆕 可学习Token生成: 输出16个多样化token (B,16,768)  🆕 匹配DCA的decoupled_ca_dim=16  🆕 每个token编码深度的不同方面  🆕 比简单重复更有效</text>
  </g>
  
  <!-- DCA Integration Note -->
  <g id="dca-note">
    <text x="50" y="995" class="subtitle">与DCA机制的完美匹配</text>
    
    <rect x="50" y="1005" width="1500" height="45" style="fill: #e8f5e9; stroke: #4caf50; stroke-width: 2; rx: 6;"/>
    <text x="60" y="1020" class="param-text">📌 DCA原理: 从条件序列末尾提取 decoupled_ca_dim 个token进行独立的Cross-Attention</text>
    <text x="60" y="1035" class="param-text">💡 完美匹配: 我们生成16个token → 放在条件序列末尾 → DCA提取这16个 → 每个token都是有用的深度信息，不会被其他条件"污染"</text>
    <text x="60" y="1050" class="param-text">⚡ 效果提升: context = context_main + 2.0 * context_depth (深度权重可调节)</text>
  </g>

</svg>